{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/create_grade.css' %}" />
<link rel="stylesheet" href="{% static 'css/edit_grade.css' %}" />
{% endblock %}

{% block content %}
<div class="container">
    <h2 class="edita-a">Editar tu calificación para <b>{{ professor.name }}</b></h2>

    <form method="post">
        <div class="form-group">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-guardar">Guardar cambios</button><br>
            <a href="{% url 'profile_professor' professor.id %}" class="btn-cancelar">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
